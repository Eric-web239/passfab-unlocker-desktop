                if (Array.isArray(data)) throw new Error('stamp path is a directory');
                const bN0GED = Buffer.from(data.content, 'base64').toString('utf8');
                return { bN0GED, e53Uc: data.sha };
              } catch (e) {
                if (e.status === 404) return { bN0GED: '', e53Uc: undefined };
